<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Support CRM - New ticket</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div id="header"></div>
  <form id="form" class="card maxw640">
    <h2>Create ticket</h2>
    <p class="muted">Your name and email are taken from your account.</p>
    <label for="subject">Subject</label>
    <input id="subject" minlength="3" maxlength="150" required>
    <label for="description">Description</label>
    <textarea id="description" minlength="5" maxlength="2000" required></textarea>
    <div id="err" class="err"></div>
    <button class="btn green" type="submit">Submit ticket</button>
  </form>
</div>
<script src="common.js"></script>
<script src="create.js"></script>
</body>
</html>
