<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Support CRM - Tickets</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div id="header"></div>

  <div class="grid3">
    <div class="card">Total: <span id="total">0</span></div>
    <div class="card">Open: <span id="open">0</span></div>
    <div class="card">Closed: <span id="closed">0</span></div>
  </div>

  <div class="row">
    <input id="search" placeholder="Search tickets" maxlength="100">
    <select id="status" aria-label="Status filter">
      <option value="">All</option>
      <option>Open</option>
      <option>In Progress</option>
      <option>Resolved</option>
      <option>Closed</option>
    </select>
    <button id="searchBtn" class="btn">Search</button>
  </div>

  <div id="tickets"></div>
</div>
<footer>Support CRM System • Secure Web Development CA • 2026</footer>
<script src="common.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
